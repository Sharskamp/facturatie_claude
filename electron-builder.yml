appId: nl.streamlinefacturatie.app
productName: Streamline Facturatie
copyright: Streamline Facturatie

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - prisma/migrations/**/*
  - "!node_modules/**/*"
  # OCR-runtime en ONNX: nodig in productie (worden via require() geladen)
  - "node_modules/onnxruntime-node/**/*"
  - "node_modules/onnxruntime-common/**/*"
  # PDF-tekst extractie via pdfjs-dist (alleen legacy CJS build nodig)
  - "node_modules/pdfjs-dist/legacy/build/pdf.js"
  - "node_modules/pdfjs-dist/legacy/build/pdf.worker.js"
  - "node_modules/pdfjs-dist/package.json"

asarUnpack:
  # Native .node binaries en grote ONNX runtime libs moeten buiten asar staan
  - "node_modules/onnxruntime-node/**/*"

extraResources:
  - from: prisma/migrations
    to: migrations
  - from: prisma/schema.prisma
    to: schema.prisma
  - from: resources/paddleocr
    to: paddleocr
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: Sharskamp
  repo: rxx
